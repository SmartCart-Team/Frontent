<body class="bg-background text-on-background font-body-md antialiased">
<!-- Minimal TopNavBar -->
<nav class="bg-surface/80 dark:bg-surface-container/80 backdrop-blur-md w-full z-50 border-b border-outline-variant/30 shadow-sm">
<div class="flex items-center justify-center px-margin-desktop max-w-container-max mx-auto h-16 w-full">
<a class="text-headline-md font-headline-md font-black text-on-surface dark:text-on-primary-fixed tracking-tight hover:opacity-80 transition-opacity" href="index.html">SmartCart</a>
</div>
</nav>

<main class="w-full min-h-[calc(100vh-4rem)] flex items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-lg bg-surface-container-low">
<div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-[0px_12px_32px_rgba(15,23,42,0.10)] border border-outline-variant/30 overflow-hidden">

    <!-- Tabs -->
    <div class="grid grid-cols-2 border-b border-outline-variant/30">
        <button id="tab-login-btn" onclick="switchTab('login')" class="py-4 font-label-bold text-label-bold uppercase tracking-widest text-on-surface border-b-2 border-secondary transition-colors">
            Log In
        </button>
        <button id="tab-signup-btn" onclick="switchTab('signup')" class="py-4 font-label-bold text-label-bold uppercase tracking-widest text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors">
            Sign Up
        </button>
    </div>

    <div class="p-6 md:p-8">

        <!-- LOGIN PANEL -->
        <div id="panel-login">
            <h1 class="font-headline-sm text-headline-sm font-bold text-on-surface mb-1">Welcome back</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant mb-6">Log in to track orders and manage your account.</p>

            <form onsubmit="event.preventDefault(); window.location='profile.html';" class="space-y-4">
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface-variant mb-1.5" for="login-email">Email</label>
                    <input class="w-full h-11 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" id="login-email" placeholder="you@example.com" required="" type="email"/>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block font-label-bold text-label-bold text-on-surface-variant" for="login-password">Password</label>
                        <a class="font-body-sm text-[13px] text-secondary hover:underline" href="#">Forgot password?</a>
                    </div>
                    <input class="w-full h-11 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" id="login-password" placeholder="Enter your password" required="" type="password"/>
                </div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary" type="checkbox"/>
                    <span class="font-body-sm text-body-sm text-on-surface-variant">Keep me signed in</span>
                </label>
                <button class="w-full h-11 bg-[#0F172A] hover:bg-[#1e293b] text-white font-label-bold text-label-bold rounded-lg transition-colors mt-2" type="submit">
                    Log In
                </button>
            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="h-px flex-1 bg-outline-variant/50"></div>
                <span class="font-label-md text-label-md text-on-surface-variant">OR</span>
                <div class="h-px flex-1 bg-outline-variant/50"></div>
            </div>

            <button class="w-full h-11 border border-outline-variant rounded-lg flex items-center justify-center gap-2 font-label-bold text-label-bold text-on-surface hover:bg-surface-container-low transition-colors">
                <span class="material-symbols-outlined text-[18px]">mail</span>
                Continue with Google
            </button>

            <p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-6">
                Selling on SmartCart? <a class="text-secondary hover:underline font-medium" href="seller.html">Go to Seller Hub</a>
            </p>
        </div>

        <!-- SIGN UP PANEL -->
        <div class="hidden" id="panel-signup">
            <h1 class="font-headline-sm text-headline-sm font-bold text-on-surface mb-1">Create your account</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant mb-6">Join SmartCart to start shopping smarter.</p>

            <form onsubmit="event.preventDefault(); window.location='profile.html';" class="space-y-4">
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface-variant mb-1.5" for="signup-name">Full name</label>
                    <input class="w-full h-11 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" id="signup-name" placeholder="Jane Doe" required="" type="text"/>
                </div>
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface-variant mb-1.5" for="signup-email">Email</label>
                    <input class="w-full h-11 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" id="signup-email" placeholder="you@example.com" required="" type="email"/>
                </div>
                <div>
                    <label class="block font-label-bold text-label-bold text-on-surface-variant mb-1.5" for="signup-password">Password</label>
                    <input class="w-full h-11 px-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" id="signup-password" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
                </div>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input class="w-4 h-4 mt-0.5 rounded border-outline-variant text-secondary focus:ring-secondary" required="" type="checkbox"/>
                    <span class="font-body-sm text-body-sm text-on-surface-variant">I agree to the <a class="text-secondary hover:underline" href="#">Terms of Service</a> and <a class="text-secondary hover:underline" href="#">Privacy Policy</a></span>
                </label>
                <button class="w-full h-11 bg-[#0F172A] hover:bg-[#1e293b] text-white font-label-bold text-label-bold rounded-lg transition-colors mt-2" type="submit">
                    Create Account
                </button>
            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="h-px flex-1 bg-outline-variant/50"></div>
                <span class="font-label-md text-label-md text-on-surface-variant">OR</span>
                <div class="h-px flex-1 bg-outline-variant/50"></div>
            </div>

            <button class="w-full h-11 border border-outline-variant rounded-lg flex items-center justify-center gap-2 font-label-bold text-label-bold text-on-surface hover:bg-surface-container-low transition-colors">
                <span class="material-symbols-outlined text-[18px]">mail</span>
                Continue with Google
            </button>
        </div>

    </div>
</div>
</main>

<script>
    function switchTab(tab) {
        const loginBtn = document.getElementById('tab-login-btn');
        const signupBtn = document.getElementById('tab-signup-btn');
        const loginPanel = document.getElementById('panel-login');
        const signupPanel = document.getElementById('panel-signup');

        const activeClasses = ['text-on-surface', 'border-secondary'];
        const inactiveClasses = ['text-on-surface-variant', 'border-transparent'];

        if (tab === 'login') {
            loginPanel.classList.remove('hidden');
            signupPanel.classList.add('hidden');
            loginBtn.classList.add(...activeClasses);
            loginBtn.classList.remove(...inactiveClasses);
            signupBtn.classList.add(...inactiveClasses);
            signupBtn.classList.remove(...activeClasses);
        } else {
            signupPanel.classList.remove('hidden');
            loginPanel.classList.add('hidden');
            signupBtn.classList.add(...activeClasses);
            signupBtn.classList.remove(...inactiveClasses);
            loginBtn.classList.add(...inactiveClasses);
            loginBtn.classList.remove(...activeClasses);
        }
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'signup') {
        switchTab('signup');
    }
</script>
</body></html>
